<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Intro-Player</title>
  <!--
    In OBS als Browser-Quelle einbinden: http://127.0.0.1:7474/addons/intro/player.html
    1920 x 1080, „Audio über OBS steuern“ aktivieren. Nur EINE solche Quelle anlegen.
    Gesteuert wird über die Suite (Intro-Seite) oder das Streamdeck.
    ?debug=1 zeigt Zustand, Countdown und Video-Versatz an.
  -->
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    body { font-family: "Segoe UI", system-ui, sans-serif; }
    #stage { position: absolute; inset: 0; transition: opacity 1s linear; }
    #stage.black { opacity: 0; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; visibility: hidden; }
    video.active { visibility: visible; }
    #overlay {
      position: absolute; left: 50%; bottom: 9%; transform: translate(-50%, 12px);
      display: flex; align-items: center; gap: .6em;
      padding: .45em 1.1em; border-radius: 99px; background: rgba(0, 0, 0, .55); color: #fff;
      font-size: 34px; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
      opacity: 0; transition: opacity .6s, transform .6s;
    }
    #overlay.show { opacity: 1; transform: translate(-50%, 0); }
    #overlay .pulse { width: .5em; height: .5em; border-radius: 50%; background: #ff4d4d; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; transform: scale(.8); } }
    #debug {
      position: absolute; top: 12px; left: 12px; padding: 8px 12px; border-radius: 8px;
      background: rgba(0, 0, 0, .7); color: #9f9; font: 14px/1.4 Consolas, monospace; white-space: pre; display: none;
    }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #777; font-size: 22px; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video-a" muted playsinline preload="auto"></video>
    <video id="video-b" muted playsinline preload="auto"></video>
    <div id="overlay"><span class="pulse"></span><span id="overlay-text"></span></div>
  </div>
  <div id="loading"></div>
  <div id="debug"></div>
  <script src="sequencer.js"></script>
  <script src="player.js"></script>
</body>
</html>
