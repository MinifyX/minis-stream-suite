<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Umfragen</title>
  <link rel="stylesheet" href="/app/theme.css">
  <link rel="stylesheet" href="polls.css">
</head>
<body>
  <div class="page">
    <header class="title-row">
      <h1>📊 Umfragen</h1>
      <span class="spacer"></span>
      <button class="btn" id="open-settings">⚙ Einstellungen</button>
    </header>

    <div class="layout">
      <main>
        <section class="card" id="current"></section>
        <section class="card">
          <h2>🕘 Letzte Umfragen</h2>
          <div id="history"></div>
        </section>
      </main>

      <aside>
        <section class="card">
          <h2>🎥 OBS-Overlay</h2>
          <p class="note">Als Browser-Quelle in OBS einfügen, z.B. 600 × 500. Der Hintergrund ist durchsichtig. Das Overlay erscheint nur, während eine Umfrage läuft, und zeigt danach kurz das Ergebnis.</p>
          <div class="copy-row">
            <input type="text" id="overlay-url" readonly>
            <button class="btn small" id="copy-url">Kopieren</button>
          </div>
          <button class="btn" id="overlay-test">▶ Overlay testen</button>
        </section>
        <section class="card">
          <h2>💬 Im Chat</h2>
          <div id="chat-help" class="help"></div>
        </section>
      </aside>
    </div>
  </div>

  <div id="modal-host"></div>

  <script src="/app/ui.js"></script>
  <script src="polls.js"></script>
</body>
</html>
