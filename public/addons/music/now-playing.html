<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Now Playing Overlay</title>
  <!--
    In OBS als Browser-Quelle einbinden: http://127.0.0.1:7474/addons/music/now-playing.html
    z.B. 800 x 200. Hintergrund ist durchsichtig. Erscheint bei jedem Titelwechsel und blendet
    nach der eingestellten Zeit wieder aus (Musik-Seite → Overlay). ?demo=1 zeigt ein Beispiel.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font-family: "Segoe UI", system-ui, sans-serif; }
    #np {
      --accent: #9147ff;
      position: absolute; display: flex; align-items: center; gap: 14px;
      max-width: calc(100% - 32px); box-sizing: border-box; padding: 12px 18px 12px 12px;
      border-radius: 14px; background: rgba(24, 24, 27, .86); color: #fff;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .35);
      opacity: 0; transition: opacity .45s, transform .45s cubic-bezier(.2, .8, .2, 1);
    }
    #np.bottom-left { left: 16px; bottom: 16px; transform: translateY(20px); }
    #np.bottom-right { right: 16px; bottom: 16px; transform: translateY(20px); }
    #np.top-left { left: 16px; top: 16px; transform: translateY(-20px); }
    #np.top-right { right: 16px; top: 16px; transform: translateY(-20px); }
    #np.show { opacity: 1; transform: none; }
    .cover { width: 64px; height: 64px; border-radius: 9px; flex: none; background: linear-gradient(135deg, #9147ff, #ff4fd8); display: grid; place-items: center; font-size: 28px; overflow: hidden; }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .info { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #cdaaff; display: flex; align-items: center; gap: 6px; }
    .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
    .eq i { width: 2px; background: currentColor; animation: eq 1s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: -.3s; }
    .eq i:nth-child(3) { animation-delay: -.6s; }
    @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 10px; } }
    .paused .eq i { animation: none; height: 3px; }
    .title { font-size: 20px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0, 0, 0, .4); }
    .artist { font-size: 15px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .requested { font-size: 13px; font-weight: 700; color: #ffd166; }
    .requested[hidden] { display: none; }
    .bar { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .15); overflow: hidden; margin-top: 5px; width: 260px; max-width: 100%; }
    .bar div { height: 100%; width: 0; background: var(--accent); transition: width 1s linear; }
  </style>
</head>
<body>
  <div id="np" class="bottom-left">
    <div class="cover" id="cover">🎵</div>
    <div class="info">
      <div class="label"><span class="eq"><i></i><i></i><i></i></span>Now Playing</div>
      <div class="title" id="title"></div>
      <div class="artist" id="artist"></div>
      <div class="requested" id="requested" hidden></div>
      <div class="bar"><div id="bar"></div></div>
    </div>
  </div>
  <script>
    const box = document.getElementById('np');
    let np = null;
    let receivedAt = 0;
    let overlay = { showSeconds: 10, corner: 'bottom-left' };
    let shownTrack = '';
    let hideTimer = null;
    const DEMO = new URLSearchParams(location.search).has('demo');

    function show() {
      box.classList.add('show');
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = overlay.showSeconds > 0 ? setTimeout(() => box.classList.remove('show'), overlay.showSeconds * 1000) : null;
    }

    function render() {
      box.className = `${overlay.corner}${box.classList.contains('show') ? ' show' : ''}${np && !np.isPlaying ? ' paused' : ''}`;
      if (!np || !np.isPlaying) {
        // Pause/Stopp → ausblenden; beim Weiterspielen erscheint es wieder
        box.classList.remove('show');
        shownTrack = '';
        return;
      }
      document.getElementById('title').textContent = np.title;
      document.getElementById('artist').textContent = (np.artists || []).join(', ');
      const req = document.getElementById('requested');
      req.textContent = np.requestedBy ? `🙋 gewünscht von ${np.requestedBy}` : '';
      req.hidden = !np.requestedBy;
      const cover = document.getElementById('cover');
      if (np.coverUrl) {
        const img = cover.querySelector('img');
        if (!img || img.getAttribute('src') !== np.coverUrl) cover.replaceChildren(Object.assign(document.createElement('img'), { src: np.coverUrl, alt: '' }));
      } else cover.textContent = '🎵';
      if (np.trackId !== shownTrack) {
        shownTrack = np.trackId;
        show();
      } else if (overlay.showSeconds === 0) box.classList.add('show');
      progress();
    }

    function progress() {
      if (!np || !np.durationMs) return;
      const pos = np.positionMs + (np.isPlaying ? Date.now() - receivedAt : 0);
      document.getElementById('bar').style.width = `${Math.min(100, (pos / np.durationMs) * 100)}%`;
    }

    function handle(msg) {
      if (msg.overlay) overlay = msg.overlay;
      if (msg.type === 'music.overlay') {
        overlay = { showSeconds: msg.showSeconds, corner: msg.corner };
        if (np && np.isPlaying) show();
      }
      if ('nowPlaying' in msg) {
        np = msg.nowPlaying;
        receivedAt = Date.now();
      }
      render();
    }

    function connect() {
      fetch('/api/addons/music/overlay-state').then((r) => r.json()).then(handle).catch(() => {});
      const ws = new WebSocket(`ws://${location.host}/ws?channel=music.overlay`);
      ws.onmessage = (m) => handle(JSON.parse(m.data));
      ws.onclose = () => setTimeout(connect, 2000);
    }

    setInterval(progress, 1000);
    if (DEMO) {
      overlay.showSeconds = 0;
      handle({ nowPlaying: { title: 'Beispieltitel mit langem Namen', artists: ['Künstlerin', 'Feature'], durationMs: 180000, positionMs: 60000, isPlaying: true, trackId: 'demo' } });
    } else connect();
  </script>
</body>
</html>
