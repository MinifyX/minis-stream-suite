<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Watchtime</title>
  <link rel="stylesheet" href="/app/theme.css">
  <link rel="stylesheet" href="/addons/polls/polls.css">
</head>
<body>
  <div class="page">
    <header class="title-row">
      <h1>⏱️ Watchtime</h1>
      <span class="spacer"></span>
      <label class="head-toggle" id="enabled-toggle"></label>
    </header>
    <p class="note">Meldet während des Streams alle 5 Minuten, wer im Chat verbunden ist. Mit <code>!verknuepfen 123456</code> im Chat verknüpfen Zuschauer ihr Konto. Twitch-Namen ohne Verknüpfung verwirft der Server.</p>
    <section class="card">
      <h2><span data-icon="plug"></span> Verbindung</h2>
      <form id="form" autocomplete="off">
        <div class="field">
          <label for="url">Server-Adresse</label>
          <input type="text" id="url" placeholder="http://192.0.2.10:8790" maxlength="500" spellcheck="false">
        </div>
        <div class="field">
          <label for="token">Token</label>
          <input type="password" id="token" maxlength="500" autocomplete="new-password" spellcheck="false">
          <span class="note" id="token-note"></span>
        </div>
        <div class="btn-row">
          <button class="btn primary" type="submit">Speichern</button>
          <button class="btn" type="button" id="test">Verbindung testen</button>
        </div>
      </form>
    </section>
    <section class="card">
      <h2><span data-icon="satellite"></span> Status</h2>
      <p id="status" role="status"></p>
    </section>
  </div>
  <script src="/app/ui.js"></script>
  <script src="watchtime.js"></script>
</body>
</html>
