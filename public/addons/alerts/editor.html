<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Alert-Editor</title>
  <link rel="stylesheet" href="/app/theme.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="ed">
    <aside class="ed-left">
      <button class="variant-item history-item" id="history-btn">
        <span class="v-num">🕘</span>
        <span class="v-text"><strong>Verlauf</strong><small>Letzte Events, Alerts nochmal abspielen</small></span>
      </button>
      <div class="ed-left-head">VARIANTEN</div>
      <div id="categories"></div>
    </aside>

    <section class="ed-center">
      <div class="ed-toolbar" id="toolbar">
        <button class="btn" id="btn-preview">▶ Vorschau abspielen</button>
        <button class="btn" id="btn-test" title="Schickt diese Variante an das Overlay in OBS">📡 Test-Alert senden</button>
        <span class="spacer"></span>
        <span class="save-state" id="save-state"></span>
      </div>

      <div class="ed-stage-wrap" id="stage-wrap">
        <div class="ed-stage bg-checker no-i18n" id="stage"></div>
      </div>

      <div class="ed-rewards" id="rewards-view" hidden></div>
      <div class="ed-rewards" id="history-view" hidden></div>

      <div class="ed-preview-opts" id="preview-opts">
        <strong>Vorschau</strong>
        <span class="spacer"></span>
        <label class="opt" title="Spielt die Animation bei jeder Änderung neu ab (ohne Ton)">
          <span id="autoplay-toggle"></span> Autoplay
        </label>
        <label class="opt">Breite <input type="number" id="canvas-w" min="100" max="3840"> px</label>
        <label class="opt">Höhe <input type="number" id="canvas-h" min="100" max="2160"> px</label>
        <span class="bg-swatches" id="bg-swatches" title="Hintergrund der Vorschau"></span>
      </div>
    </section>

    <aside class="ed-right" id="props"></aside>

    <footer class="ed-footer">
      <span class="muted">Varianten stehen in Prioritäts-Reihenfolge: Die oberste passende gewinnt (außer bei „Zufällig“). Zum Sortieren ziehen.</span>
      <span class="spacer"></span>
      <label for="overlay-url">OBS-Browserquelle</label>
      <input type="text" id="overlay-url" readonly>
      <button class="btn primary small" id="copy-url">Kopieren</button>
    </footer>
  </div>

  <div id="modal-host"></div>

  <script src="/app/ui.js"></script>
  <script src="library.js"></script>
  <script src="effects.js"></script>
  <script src="renderer.js"></script>
  <script src="editor.js"></script>
</body>
</html>
