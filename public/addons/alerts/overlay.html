<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Alerts Overlay</title>
  <!--
    In OBS als Browser-Quelle einbinden: http://127.0.0.1:7474/addons/alerts/overlay.html
    Breite/Höhe wie im Editor eingestellt (Standard 800 x 600). Hintergrund ist transparent.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="library.js"></script>
  <script src="effects.js"></script>
  <script src="renderer.js"></script>
  <script>
    const stage = document.getElementById('stage');
    const queue = [];
    let current = null;

    function next() {
      if (current || !queue.length) return;
      const alert = queue.shift();
      // Der Suite melden, dass der Alert jetzt startet (z.B. damit das Licht-Addon zeitgleich loslegt)
      fetch('/api/addons/alerts/shown', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: alert.id }),
      }).catch(() => {});
      current = AlertRenderer.play(stage, alert, {
        onDone: () => {
          current = null;
          setTimeout(next, 400);
        },
      });
    }

    function connect() {
      const ws = new WebSocket(`ws://${location.host}/ws?channel=alerts`);
      ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.kind === 'alert') {
          queue.push(data.alert);
          next();
        } else if (data.kind === 'skip') current?.skip();
      };
      ws.onclose = () => setTimeout(connect, 2000);
    }
    connect();
  </script>
</body>
</html>
